<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account</title><meta name="theme-color" content="#070914">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-4px 0 6px}
.meter i{height:4px;border-radius:4px;background:rgba(255,255,255,.12);transition:background .3s}
.meter[data-s="1"] i:nth-child(1){background:#ff8a9b}
.meter[data-s="2"] i:nth-child(-n+2){background:#fbbf24}
.meter[data-s="3"] i:nth-child(-n+3){background:#22d3ee}
.meter[data-s="4"] i{background:#4ade80}
.hint{font-size:.78rem;color:var(--mute);margin:0 0 14px;min-height:1.1em}
.terms{display:flex;gap:10px;align-items:flex-start;margin:4px 0 18px;font-size:.85rem;color:var(--mute);line-height:1.45;cursor:pointer}
.terms input{width:18px;height:18px;margin-top:1px;accent-color:#7c5cff;flex:none;cursor:pointer}
</style>
</head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="wrap"><section class="card" aria-labelledby="title">
  <div class="logo" aria-hidden="true"><span></span></div>
  <h1 id="title">Create your account</h1>
  <p class="sub">Join to start your AI experience</p>
  <form id="f" novalidate>
    <div class="field"><input id="name" type="text" placeholder="Full name" autocomplete="name" aria-label="Full name"></div>
    <div class="field"><input id="email" type="email" placeholder="Email address" autocomplete="email" aria-label="Email address" required></div>
    <div class="field"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" aria-label="Password" required>
      <button class="eye" type="button" data-t="pw" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash hide" d="M3 3l18 18"/></svg></button></div>
    <div class="meter" id="meter" data-s="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="hint" id="hint">Use letters, numbers and a symbol for a stronger password.</p>
    <div class="field"><input id="pw2" type="password" placeholder="Confirm password" autocomplete="new-password" aria-label="Confirm password" required>
      <button class="eye" type="button" data-t="pw2" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash hide" d="M3 3l18 18"/></svg></button></div>
    <label class="terms"><input id="terms" type="checkbox"><span>I agree to the Terms of Service and Privacy Policy.</span></label>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
    <button class="btn" id="go" type="submit"><span class="spin" aria-hidden="true"></span><span class="lbl">Create Account</span></button>
  </form>
  <div class="divider">OR CONTINUE WITH</div>
  <div class="social">
    <button class="sbtn" type="button" data-p="google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>Continue with Google</button>
    <button class="sbtn" type="button" data-p="facebook"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#1877F2" d="M24 4C13 4 4 13 4 24c0 10 7.3 18.2 16.8 19.8V29.8h-5V24h5v-4.4c0-5 3-7.7 7.5-7.7 2.2 0 4.4.4 4.4.4v4.9h-2.5c-2.4 0-3.2 1.5-3.2 3.1V24h5.5l-.9 5.8h-4.6v14C36.7 42.2 44 34 44 24 44 13 35 4 24 4z"/></svg>Continue with Facebook</button>
  </div>
  <p class="foot">Already have an account? <a href="index.html" style="font-weight:600;font-size:.9rem">Sign in</a></p>
</section></main>
<script src="signup.js"></script>
</body></html>

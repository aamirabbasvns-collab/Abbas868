<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title><meta name="theme-color" content="#070914">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="wrap"><section class="card" aria-labelledby="title">
  <div class="logo" aria-hidden="true"><span></span></div>
  <h1 id="title">Welcome back</h1>
  <p class="sub">Sign in to continue to your AI experience</p>
  <form id="f" novalidate>
    <div class="field"><input id="email" type="email" placeholder="Email address" autocomplete="email" aria-label="Email address" required></div>
    <div class="field"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
      <button class="eye" id="eye" type="button" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path id="slash" class="hide" d="M3 3l18 18"/></svg></button></div>
    <div class="row"><a href="#" id="fp">Forgot password?</a></div>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
    <button class="btn" id="go" type="submit"><span class="spin" aria-hidden="true"></span><span class="lbl">Login</span></button>
  </form>
  <p class="foot">dont have an account? <a href="index.html" style="font-weight:600;font-size:.9rem">Create Account</a></p>
</section></main>
<script src="login.js"></script>
</body></html>
